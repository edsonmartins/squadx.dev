# -- Global settings
global:
  namespace: squadx

# -- Backend (Spring Boot API)
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/edsonmartins/squadx.dev/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  probes:
    readiness:
      path: /api/v1/health/live
      initialDelaySeconds: 30
      periodSeconds: 10
    liveness:
      path: /api/v1/health/live
      initialDelaySeconds: 60
      periodSeconds: 15

# -- Frontend (Next.js)
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/edsonmartins/squadx.dev/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# -- Client (desktop/CLI)
client:
  replicaCount: 1
  image:
    repository: ghcr.io/edsonmartins/squadx.dev/client
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -- PostgreSQL
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    size: 10Gi
    # storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  auth:
    username: squadx
    database: squadx

# -- Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# -- Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "squadx-backend"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
  tls:
    - secretName: squadx-tls
      hosts:
        - squadx.dev
        - www.squadx.dev
        - api.squadx.dev
  hosts:
    frontend: squadx.dev
    backend: api.squadx.dev

# -- Multi-Region Configuration
region:
  # Current region name for this deployment
  name: us-east-1
  # Display name for the region
  displayName: "US East (N. Virginia)"
  # Routing strategy: nearest, round-robin, failover
  routingStrategy: nearest
  # All available regions (comma-separated, injected into backend)
  available: "us-east-1,eu-west-1,ap-southeast-1"

# -- Node selector for region-based pod placement
nodeSelector: {}
  # topology.kubernetes.io/region: us-east-1

# -- Topology spread constraints for multi-region scheduling
topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

# -- Application config (non-secret)
config:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_USERNAME: "squadx"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://squadx.dev,https://www.squadx.dev"
  SUPABASE_URL: "https://your-project.supabase.co"
  RESEND_FROM_EMAIL: "noreply@squadx.dev"
  AWS_S3_BUCKET: "squadx-recordings"
  AWS_REGION: "us-east-1"
  SQUADX_REGION: "us-east-1"
  SQUADX_REGIONS: "us-east-1,eu-west-1,ap-southeast-1"
  SQUADX_ROUTING_STRATEGY: "nearest"
  NEXT_PUBLIC_API_URL: "https://api.squadx.dev"
  NEXT_PUBLIC_WS_URL: "wss://api.squadx.dev/ws"

# -- Secrets (base64-encoded — MUST be replaced before deploying!)
# All values below decode to "change-me". Replace every one with real secrets.
# Generate with: echo -n 'your-real-value' | base64
secrets:
  JWT_SECRET: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbWluLTMyLWNoYXJz"          # REPLACE: min 32-char secret
  SPRING_DATASOURCE_PASSWORD: "Y2hhbmdlLW1l"   # REPLACE: PostgreSQL password
  SUPABASE_ANON_KEY: "Y2hhbmdlLW1l"            # REPLACE: from Supabase dashboard
  SUPABASE_SERVICE_KEY: "Y2hhbmdlLW1l"         # REPLACE: from Supabase dashboard
  STRIPE_API_KEY: "Y2hhbmdlLW1l"               # REPLACE: from Stripe dashboard
  STRIPE_WEBHOOK_SECRET: "Y2hhbmdlLW1l"        # REPLACE: from Stripe webhook config
  RESEND_API_KEY: "Y2hhbmdlLW1l"               # REPLACE: from Resend dashboard
  AWS_ACCESS_KEY_ID: "Y2hhbmdlLW1l"            # REPLACE: from AWS IAM
  AWS_SECRET_ACCESS_KEY: "Y2hhbmdlLW1l"        # REPLACE: from AWS IAM
  POSTGRES_PASSWORD: "Y2hhbmdlLW1l"            # REPLACE: must match SPRING_DATASOURCE_PASSWORD
