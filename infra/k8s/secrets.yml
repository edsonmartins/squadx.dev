# =============================================================================
# IMPORTANT: DO NOT apply this file without replacing ALL placeholder values!
# Every value below decodes to "change-me" and MUST be replaced with real
# secrets before deploying to any environment (staging or production).
#
# For production, use a secrets management solution:
# - Sealed Secrets: https://sealed-secrets.netlify.app/
# - External Secrets Operator: https://external-secrets.io/
# - AWS Secrets Manager / HashiCorp Vault
#
# NEVER commit real secrets to version control.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: squadx-secrets
  namespace: squadx
  labels:
    app.kubernetes.io/name: squadx
type: Opaque
data:
  # All values are base64-encoded placeholders — MUST be replaced before applying.
  # Generate with: echo -n 'your-real-value' | base64
  JWT_SECRET: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbWluLTMyLWNoYXJz"          # REPLACE: min 32-char secret
  SPRING_DATASOURCE_PASSWORD: "Y2hhbmdlLW1l"   # REPLACE: PostgreSQL password
  SUPABASE_ANON_KEY: "Y2hhbmdlLW1l"            # REPLACE: from Supabase dashboard
  SUPABASE_SERVICE_KEY: "Y2hhbmdlLW1l"         # REPLACE: from Supabase dashboard
  STRIPE_API_KEY: "Y2hhbmdlLW1l"               # REPLACE: from Stripe dashboard
  STRIPE_WEBHOOK_SECRET: "Y2hhbmdlLW1l"        # REPLACE: from Stripe webhook config
  RESEND_API_KEY: "Y2hhbmdlLW1l"               # REPLACE: from Resend dashboard
  AWS_ACCESS_KEY_ID: "Y2hhbmdlLW1l"            # REPLACE: from AWS IAM
  AWS_SECRET_ACCESS_KEY: "Y2hhbmdlLW1l"        # REPLACE: from AWS IAM
  POSTGRES_PASSWORD: "Y2hhbmdlLW1l"            # REPLACE: must match SPRING_DATASOURCE_PASSWORD
