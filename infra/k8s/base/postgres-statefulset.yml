apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: squadx-postgres
  labels:
    app.kubernetes.io/name: squadx
    app.kubernetes.io/component: postgres
spec:
  serviceName: squadx-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: squadx
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squadx
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "squadx"
            - name: POSTGRES_DB
              value: "squadx"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: squadx-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - squadx
                - -d
                - squadx
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - squadx
                - -d
                - squadx
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: squadx-postgres
  labels:
    app.kubernetes.io/name: squadx
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: squadx
    app.kubernetes.io/component: postgres
