global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h

receivers:
  # Default receiver — logs alerts but takes no action.
  # Replace with a real receiver (email/Slack) for production.
  - name: 'null'

  # Uncomment and configure for email notifications:
  # - name: 'default'
  #   email_configs:
  #     - to: 'alerts@squadx.dev'
  #       from: 'alertmanager@squadx.dev'
  #       smarthost: 'smtp.example.com:587'
  #       auth_username: 'alertmanager@squadx.dev'
  #       auth_password: '<SMTP_PASSWORD>'
  #       send_resolved: true
  #       require_tls: true

  # Uncomment and configure for critical alerts via Slack + email:
  - name: 'critical'
  #   slack_configs:
  #     - api_url: '<SLACK_WEBHOOK_URL>'
  #       channel: '#squadx-alerts'
  #       send_resolved: true
  #       title: '{{ .GroupLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
  #   email_configs:
  #     - to: 'alerts@squadx.dev'
  #       from: 'alertmanager@squadx.dev'
  #       smarthost: 'smtp.example.com:587'
  #       auth_username: 'alertmanager@squadx.dev'
  #       auth_password: '<SMTP_PASSWORD>'
  #       send_resolved: true
  #       require_tls: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
