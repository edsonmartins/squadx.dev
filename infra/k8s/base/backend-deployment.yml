apiVersion: apps/v1
kind: Deployment
metadata:
  name: squadx-backend
  labels:
    app.kubernetes.io/name: squadx
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: squadx
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squadx
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/edsonmartins/squadx.dev/backend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: squadx-config
            - secretRef:
                name: squadx-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: squadx-backend
  labels:
    app.kubernetes.io/name: squadx
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9091
      targetPort: management
      protocol: TCP
      name: management
  selector:
    app.kubernetes.io/name: squadx
    app.kubernetes.io/component: backend
