<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="gDash" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gBack" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gClient" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gDocker" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#0f172a"/>

  <!-- Dashboard Web -->
  <rect x="60" y="30" width="680" height="90" rx="12" fill="url(#gDash)" filter="url(#shadow)"/>
  <text x="400" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#fff">Dashboard Web</text>
  <text x="400" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c7d2fe">Next.js 16 · React 19 · Kanban · Live View · Voice/Video · Analytics · Calendar</text>
  <text x="400" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a5b4fc">PWA · Tauri Desktop · Expo Mobile</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="120" x2="400" y2="150" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="394,148 400,158 406,148" fill="#475569"/>

  <!-- Backend -->
  <rect x="60" y="158" width="680" height="90" rx="12" fill="url(#gBack)" filter="url(#shadow)"/>
  <text x="400" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#fff">SquadX Backend</text>
  <text x="400" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a7f3d0">Spring Boot 3.4 · Java 21 · PostgreSQL · Redis · Flyway V1–V14</text>
  <text x="400" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7">REST API · WebSocket · SSO/OIDC · RBAC · Billing · Audit · Highlights</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="248" x2="400" y2="278" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="394,276 400,286 406,276" fill="#475569"/>

  <!-- Client -->
  <rect x="60" y="286" width="680" height="90" rx="12" fill="url(#gClient)" filter="url(#shadow)"/>
  <text x="400" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#fff">SquadX Client</text>
  <text x="138" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fef3c7" font-style="italic">Ambiente Local</text>
  <text x="400" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fde68a">Python 3.12 · LangGraph · LiteLLM · aiortc · Docker SDK</text>
  <text x="400" y="359" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcd34d">Orquestração · 7 Agentes · VNC→WebRTC Bridge · STOMP Client</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="376" x2="400" y2="406" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="394,404 400,414 406,404" fill="#475569"/>

  <!-- Docker Containers -->
  <rect x="60" y="414" width="680" height="80" rx="12" fill="url(#gDocker)" filter="url(#shadow)"/>
  <text x="400" y="446" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#fff">Containers Docker Hardened</text>
  <text x="400" y="469" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fecaca">Seccomp · Read-only FS · CAP_DROP=ALL · Network Policy · Lifecycle · Métricas</text>
  <text x="400" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fca5a5">Docker (runc) → gVisor (runsc) → Firecracker (microVM)</text>
</svg>
