# =============================================================================
# Docker Compose override — Nginx reverse proxy for SquadX.dev
# Usage:
#   docker compose -f docker-compose.yml -f infra/nginx/docker-compose.nginx.yml up -d
# =============================================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: squadx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Let's Encrypt certificates (managed by certbot on the host)
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # ACME challenge directory for certificate renewal
      - certbot-webroot:/var/www/certbot:ro

      # Log persistence
      - nginx-logs:/var/log/nginx
    network_mode: host
    # network_mode: host gives nginx direct access to localhost:8080 and
    # localhost:3000 without extra Docker networking. If you prefer bridge
    # networking, remove network_mode and use extra_hosts or a shared
    # Docker network instead.
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  certbot-webroot:
    driver: local
  nginx-logs:
    driver: local
