apiVersion: v1
kind: ConfigMap
metadata:
  name: squadx-config
  namespace: squadx
  labels:
    app.kubernetes.io/name: squadx
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://squadx-postgres:5432/squadx"
  SPRING_DATASOURCE_USERNAME: "squadx"
  SPRING_DATA_REDIS_HOST: "squadx-redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://squadx.dev,https://www.squadx.dev"
  SUPABASE_URL: "https://your-project.supabase.co"
  RESEND_FROM_EMAIL: "noreply@squadx.dev"
  AWS_S3_BUCKET: "squadx-recordings"
  AWS_REGION: "us-east-1"
  NEXT_PUBLIC_API_URL: "https://api.squadx.dev"
  NEXT_PUBLIC_WS_URL: "wss://api.squadx.dev/ws"
