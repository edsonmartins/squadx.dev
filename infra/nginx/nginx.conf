# =============================================================================
# SquadX.dev — Production Nginx Configuration (TLS 1.3)
# =============================================================================
# Backend:  Spring Boot  -> localhost:8080  (/api/**, /ws/**)
# Frontend: Next.js      -> localhost:3000
# TLS terminated here with TLS 1.3 + modern cipher suite.
# CORS handled by Spring Boot.
# =============================================================================

# ---------------------------------------------------------------------------
# Worker tuning
# ---------------------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # -----------------------------------------------------------------------
    # Basic MIME & logging
    # -----------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # -----------------------------------------------------------------------
    # Rate limiting
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    # -----------------------------------------------------------------------
    # Upstream definitions
    # -----------------------------------------------------------------------
    upstream backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream frontend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # HTTP -> HTTPS redirect (port 80)
    # -----------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name squadx.dev www.squadx.dev;

        # Let's Encrypt HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS server (port 443) — TLS 1.3 with HTTP/2
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name squadx.dev www.squadx.dev;

        # -------------------------------------------------------------------
        # TLS 1.3 configuration
        # TLS 1.3 preferred; TLS 1.2 as fallback for compatibility.
        # Modern cipher suite prioritizing TLS 1.3 AEAD ciphers.
        # -------------------------------------------------------------------
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # DH parameters for DHE ciphers (generated at build time)
        ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # OCSP stapling — speeds up TLS handshake by bundling certificate
        # revocation status into the TLS response.
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/cert.pem;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # TLS session resumption — reduces latency on repeat connections.
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # -------------------------------------------------------------------
        # Security headers
        # -------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # -------------------------------------------------------------------
        # Request size limits & proxy timeouts
        # -------------------------------------------------------------------
        client_max_body_size 50m;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # -------------------------------------------------------------------
        # Backend API — /api/
        # -------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # -------------------------------------------------------------------
        # Rate-limited login endpoint
        # -------------------------------------------------------------------
        location /api/v1/auth/login {
            limit_req zone=login burst=10 nodelay;

            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # -------------------------------------------------------------------
        # WebSocket — /ws/
        # STOMP/SockJS real-time messaging. Requires Upgrade headers.
        # -------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Extended timeouts for persistent WebSocket connections
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # -------------------------------------------------------------------
        # Next.js static assets — /_next/static/
        # Content-hashed; cache aggressively (1 year).
        # -------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://frontend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # -------------------------------------------------------------------
        # Frontend — everything else
        # -------------------------------------------------------------------
        location / {
            proxy_pass http://frontend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
