spring:
  application:
    name: squadx-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
          microsoft:
            client-id: ${OAUTH2_MICROSOFT_CLIENT_ID:}
            client-secret: ${OAUTH2_MICROSOFT_CLIENT_SECRET:}
            scope: openid,profile,email
            client-name: Microsoft
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          okta:
            client-id: ${OAUTH2_OKTA_CLIENT_ID:}
            client-secret: ${OAUTH2_OKTA_CLIENT_SECRET:}
            scope: openid,profile,email
            client-name: Okta
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          microsoft:
            issuer-uri: https://login.microsoftonline.com/${OAUTH2_MICROSOFT_TENANT_ID:common}/v2.0
          okta:
            issuer-uri: ${OAUTH2_OKTA_ISSUER_URI:}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Supabase Configuration (for Live Streaming)
supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  service-key: ${SUPABASE_SERVICE_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}

# Email Configuration (Resend)
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@squadx.dev}

# Billing Configuration (Stripe)
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  prices:
    starter: ${STRIPE_PRICE_STARTER:}
    professional: ${STRIPE_PRICE_PROFESSIONAL:}

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Logging
logging:
  level:
    root: INFO
    dev.squadx: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Multi-Region Configuration
squadx:
  region:
    current: ${SQUADX_REGION:us-east-1}
    available: ${SQUADX_REGIONS:us-east-1,eu-west-1,ap-southeast-1}
  routing:
    strategy: ${SQUADX_ROUTING_STRATEGY:nearest}
  service-secret: ${SQUADX_SERVICE_SECRET:}
  brainsentry:
    url: ${SQUADX_BRAINSENTRY_URL:http://localhost:8090}
    tenant-id: ${SQUADX_BRAINSENTRY_TENANT_ID:default}
    enabled: ${SQUADX_BRAINSENTRY_ENABLED:false}
  live:
    url: ${SQUADX_LIVE_URL:http://localhost:3100}
    enabled: ${SQUADX_LIVE_ENABLED:false}
  notifications:
    slack:
      enabled: true
    discord:
      enabled: true
    teams:
      enabled: true
  event-buffer:
    max-events-per-user: 100
    ttl-minutes: 5
  ai:
    enabled: ${SQUADX_AI_ENABLED:false}

# JobRunr (Background Job Scheduling)
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 10
    dashboard:
      enabled: true
      port: 8081
    database:
      type: sql
    misc:
      allow-anonymous-data-usage: false

# Spring AI (Optional)
spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    chat:
      options:
        model: gpt-4o-mini
        temperature: 0.3

# Google Calendar Integration
google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:3000/api/calendar/callback}

# S3 Configuration (Session Recording)
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:squadx-recordings}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    dev.squadx: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    dev.squadx: INFO
