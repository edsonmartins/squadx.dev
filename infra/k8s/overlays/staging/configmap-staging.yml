apiVersion: v1
kind: ConfigMap
metadata:
  name: squadx-config
data:
  # Staging host overrides (strategic-merge patched onto the base config, which is
  # prod-valued). Everything not listed here is inherited from base. The Spring
  # profile stays "prod" — there is no "staging" profile, and staging should mirror
  # production behaviour.
  CORS_ALLOWED_ORIGINS: "https://staging.squadx.dev"
  NEXT_PUBLIC_API_URL: "https://api.staging.squadx.dev"
  NEXT_PUBLIC_WS_URL: "wss://api.staging.squadx.dev/ws"
