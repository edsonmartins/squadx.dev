services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: squadx
      POSTGRES_PASSWORD: squadx_dev_password
      POSTGRES_DB: squadx
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squadx -d squadx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
