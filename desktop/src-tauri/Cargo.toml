[package]
name = "squadx-desktop"
version = "0.1.0"
description = "SquadX Desktop - AI Squad Management"
authors = ["SquadX Team"]
edition = "2021"

[lib]
name = "squadx_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
