name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'
  PYTHON_VERSION: '3.11'

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squadx
          POSTGRES_PASSWORD: squadx_test
          POSTGRES_DB: squadx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean verify -B

      - name: Run tests
        run: ./mvnw test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/squadx_test
          SPRING_DATASOURCE_USERNAME: squadx
          SPRING_DATASOURCE_PASSWORD: squadx_test
          SPRING_DATA_REDIS_HOST: localhost
          JWT_SECRET: test-secret-key-for-ci-must-be-32-chars

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  client:
    name: Client (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check squadx_client

      - name: Type check with mypy
        run: mypy squadx_client --ignore-missing-imports

      - name: Run tests
        run: pytest -v --cov=squadx_client

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, client]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:latest
            ghcr.io/${{ github.repository }}/client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The sandbox base image the daemon runs agents in. Without this published,
      # the client can create no sandboxes and the core flow does not work.
      - name: Build and Push Agent Sandbox Image (base)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/docker/agent.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agent:latest
            ghcr.io/${{ github.repository }}/agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Live-view variant (Xvfb + x11vnc + noVNC) — used when SQUADX_ENABLE_VNC is on.
      - name: Build and Push Agent Sandbox Image (live-view)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/docker/agent.Dockerfile
          target: live-view
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agent:live
            ghcr.io/${{ github.repository }}/agent:live-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Egress firewall sidecar (RFC-0006) — required for the default-deny egress
      # policy the daemon applies before an agent joins the network namespace.
      - name: Build and Push Egress Proxy Image
        uses: docker/build-push-action@v5
        with:
          context: ./client/docker
          file: ./client/docker/egress-proxy.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/egress-proxy:latest
            ghcr.io/${{ github.repository }}/egress-proxy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      # Staging is isolated from production: its own namespace (squadx-staging),
      # hosts, and issuer — see infra/k8s/overlays/staging.
      - name: Ensure staging namespace
        run: kubectl create namespace squadx-staging --dry-run=client -o yaml | kubectl apply -f -

      # Real secrets come from GitHub Actions secrets, never from a committed file.
      # Add these under Settings > Secrets and variables > Actions. Created BEFORE the
      # overlay so the deployments' pods find the secret they reference on first start.
      # Values never print (create ... | apply -f - keeps them off the log).
      - name: Create application secrets from GitHub secrets
        run: |
          kubectl create secret generic squadx-secrets -n squadx-staging \
            --from-literal=JWT_SECRET='${{ secrets.STAGING_JWT_SECRET }}' \
            --from-literal=SPRING_DATASOURCE_PASSWORD='${{ secrets.STAGING_DB_PASSWORD }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.STAGING_DB_PASSWORD }}' \
            --from-literal=SUPABASE_ANON_KEY='${{ secrets.STAGING_SUPABASE_ANON_KEY }}' \
            --from-literal=SUPABASE_SERVICE_KEY='${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}' \
            --from-literal=STRIPE_API_KEY='${{ secrets.STAGING_STRIPE_API_KEY }}' \
            --from-literal=STRIPE_WEBHOOK_SECRET='${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}' \
            --from-literal=RESEND_API_KEY='${{ secrets.STAGING_RESEND_API_KEY }}' \
            --from-literal=AWS_ACCESS_KEY_ID='${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}' \
            --from-literal=AWS_SECRET_ACCESS_KEY='${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy the staging overlay
        run: kubectl apply -k infra/k8s/overlays/staging

      # Refresh the secret contents into already-running pods on redeploys.
      - name: Roll deployments onto the current secret
        run: kubectl rollout restart deployment/squadx-backend -n squadx-staging || true

      - name: Update image tags
        run: |
          kubectl set image deployment/squadx-backend backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n squadx-staging
          kubectl set image deployment/squadx-frontend frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} -n squadx-staging
          # The client daemon is not an in-cluster Deployment — it runs on a dedicated
          # Docker host (client/deploy/README.md), so there is nothing to set here.
