# -- Global settings
global:
  namespace: squadx

# -- Backend (Spring Boot API)
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/edsonmartins/squadx.dev/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  probes:
    readiness:
      path: /api/v1/health/live
      initialDelaySeconds: 30
      periodSeconds: 10
    liveness:
      path: /api/v1/health/live
      initialDelaySeconds: 60
      periodSeconds: 15

# -- Frontend (Next.js)
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/edsonmartins/squadx.dev/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# -- Client (desktop/CLI)
client:
  replicaCount: 1
  image:
    repository: ghcr.io/edsonmartins/squadx.dev/client
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -- PostgreSQL
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    size: 10Gi
    # storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  auth:
    username: squadx
    database: squadx

# -- Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# -- Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "squadx-backend"
  tls:
    secretName: squadx-tls
  hosts:
    frontend: squadx.dev
    backend: api.squadx.dev

# -- Application config (non-secret)
config:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_USERNAME: "squadx"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://squadx.dev,https://www.squadx.dev"
  SUPABASE_URL: "https://your-project.supabase.co"
  RESEND_FROM_EMAIL: "noreply@squadx.dev"
  AWS_S3_BUCKET: "squadx-recordings"
  AWS_REGION: "us-east-1"
  NEXT_PUBLIC_API_URL: "https://api.squadx.dev"
  NEXT_PUBLIC_WS_URL: "wss://api.squadx.dev/ws"

