spring:
  application:
    name: squadx-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Email Configuration (Resend)
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@squadx.dev}

# Billing Configuration (Stripe)
# Feature flag (T-0011-5 / ADR-0011): billing fica OFF por default na fase
# interna — sem produto de cobrança ainda, e o webhook público é superfície
# de ataque sem contrapartida. Ligar apenas quando o produto for a mercado.
stripe:
  enabled: ${STRIPE_ENABLED:false}
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  prices:
    starter: ${STRIPE_PRICE_STARTER:}
    professional: ${STRIPE_PRICE_PROFESSIONAL:}

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator
management:
  # Separate management plane: ingress exposes 8080, Prometheus scrapes 9091 internally.
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Logging
logging:
  level:
    root: INFO
    dev.squadx: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Multi-Region Configuration
squadx:
  region:
    current: ${SQUADX_REGION:us-east-1}
    available: ${SQUADX_REGIONS:us-east-1,eu-west-1,ap-southeast-1}
  routing:
    strategy: ${SQUADX_ROUTING_STRATEGY:nearest}
  service-secret: ${SQUADX_SERVICE_SECRET:}
  harnesses:
    catalog: ${SQUADX_HARNESS_CATALOG:}

spec:
  materialization:
    enabled: ${SQUADX_SPEC_MATERIALIZATION_ENABLED:false}
  brainsentry:
    url: ${SQUADX_BRAINSENTRY_URL:http://localhost:8090}
    tenant-id: ${SQUADX_BRAINSENTRY_TENANT_ID:default}
    per-organization-tenant: ${SQUADX_BRAINSENTRY_PER_ORGANIZATION_TENANT:true}
    tenant-prefix: ${SQUADX_BRAINSENTRY_TENANT_PREFIX:org-}
    enabled: ${SQUADX_BRAINSENTRY_ENABLED:false}

intelligence:
  default-provider: ${SQUADX_INTELLIGENCE_DEFAULT_PROVIDER:native}
  default-fallback: ${SQUADX_INTELLIGENCE_DEFAULT_FALLBACK:}
  ripgrep:
    enabled: ${SQUADX_INTELLIGENCE_RIPGREP_ENABLED:false}
    repository-root: ${SQUADX_INTELLIGENCE_REPOSITORY_ROOT:}
  native:
    enabled: ${SQUADX_INTELLIGENCE_NATIVE_ENABLED:false}
    repository-root: ${SQUADX_INTELLIGENCE_REPOSITORY_ROOT:}
    scip:
      enabled: ${SQUADX_INTELLIGENCE_SCIP_ENABLED:false}
      java-version: ${SQUADX_SCIP_JAVA_VERSION:0.13.1}
      artifact-root: ${SQUADX_SCIP_ARTIFACT_ROOT:/var/lib/squadx/scip}
  repowise:
    enabled: ${SQUADX_INTELLIGENCE_REPOWISE_ENABLED:false}
    url: ${REPOWISE_URL:http://127.0.0.1:8765}
    api-key: ${REPOWISE_API_KEY:}
    repository-root: ${SQUADX_INTELLIGENCE_REPOSITORY_ROOT:}
    timeout-seconds: ${REPOWISE_TIMEOUT_SECONDS:15}
    failure-threshold: ${REPOWISE_FAILURE_THRESHOLD:3}
    open-seconds: ${REPOWISE_CIRCUIT_OPEN_SECONDS:30}

pullwise:
  conformance:
    enabled: ${PULLWISE_CONFORMANCE_ENABLED:false}
    url: ${PULLWISE_URL:http://pullwise:8080}
    api-key: ${PULLWISE_CONFORMANCE_API_KEY:}
    timeout-ms: ${PULLWISE_CONFORMANCE_TIMEOUT_MS:30000}
    failure-threshold: ${PULLWISE_CONFORMANCE_FAILURE_THRESHOLD:3}
    open-seconds: ${PULLWISE_CONFORMANCE_OPEN_SECONDS:30}

pass5:
  tests:
    timeout-ms: ${PASS5_TESTS_TIMEOUT_MS:120000}
  worker:
    poll-interval-ms: ${SQUADX_INTELLIGENCE_POLL_INTERVAL_MS:5000}
  briefing:
    enabled: ${SQUADX_INTELLIGENCE_BRIEFING_ENABLED:false}
    max-hits: ${SQUADX_INTELLIGENCE_BRIEFING_MAX_HITS:5}
    max-chars: ${SQUADX_INTELLIGENCE_BRIEFING_MAX_CHARS:6000}
  live:
    url: ${SQUADX_LIVE_URL:http://localhost:3100}
    enabled: ${SQUADX_LIVE_ENABLED:false}
  linktor:
    url: ${SQUADX_LINKTOR_URL:http://localhost:8081}
    enabled: ${SQUADX_LINKTOR_ENABLED:false}
    email: ${SQUADX_LINKTOR_EMAIL:}
    password: ${SQUADX_LINKTOR_PASSWORD:}
    default-conversation-id: ${SQUADX_LINKTOR_DEFAULT_CONVERSATION_ID:}
    channel-id: ${SQUADX_LINKTOR_CHANNEL_ID:}
    contact-id: ${SQUADX_LINKTOR_CONTACT_ID:}
    auto-create-conversation: ${SQUADX_LINKTOR_AUTO_CREATE_CONVERSATION:false}
  notifications:
    slack:
      enabled: true
    discord:
      enabled: true
    teams:
      enabled: true
  event-buffer:
    max-events-per-user: 100
    ttl-minutes: 5
  ai:
    enabled: ${SQUADX_AI_ENABLED:false}

# JobRunr (Background Job Scheduling)
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 10
    dashboard:
      enabled: true
      port: 8081
    database:
      type: sql
    misc:
      allow-anonymous-data-usage: false

# Spring AI (Optional)
spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    chat:
      options:
        model: gpt-4o-mini
        temperature: 0.3

# Google Calendar Integration
google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:3000/api/calendar/callback}

# S3 Configuration (Session Recording)
aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    bucket: ${AWS_S3_BUCKET:squadx-recordings}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    dev.squadx: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    dev.squadx: INFO
