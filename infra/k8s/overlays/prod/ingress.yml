apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squadx-ingress
  labels:
    app.kubernetes.io/name: squadx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "squadx-backend"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - squadx.dev
        - api.squadx.dev
      secretName: squadx-tls
  rules:
    - host: squadx.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squadx-frontend
                port:
                  number: 3000
    - host: api.squadx.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squadx-backend
                port:
                  number: 8080
