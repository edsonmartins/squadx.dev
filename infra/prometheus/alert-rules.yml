groups:
  - name: squadx-backend
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate on {{ $labels.instance }}"
          description: "More than 10% of requests are returning 5xx status codes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.instance }}"
          description: "95th percentile latency is above 2 seconds."

      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "{{ $labels.job }} instance {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap memory usage on {{ $labels.instance }}"
          description: "JVM heap memory usage is above 85%."

      - alert: DiskSpaceRunningLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} < 1e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Available disk space is below 1GB."

      - alert: SquadXExecutionFailureRateHigh
        expr: sum(rate(squadx_business_executions_completed_total{outcome="failed"}[15m])) / clamp_min(sum(rate(squadx_business_executions_completed_total[15m])), 0.001) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SquadX execution failure rate is above 20%"
          description: "The rolling execution failure ratio has remained above 20% for 10 minutes."

      - alert: SquadXAgentDead
        expr: increase(squadx_business_agents_dead_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A SquadX agent was declared dead"
          description: "The heartbeat watchdog declared at least one agent dead in the last 10 minutes."

      - alert: SquadXExecutionBacklogGrowing
        expr: sum(squadx_business_executions_active{status="pending"}) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SquadX execution backlog is growing"
          description: "More than 10 executions have remained pending for 15 minutes."
