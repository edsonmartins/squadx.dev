[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squadx-client"
version = "0.1.0"
description = "SquadX.dev Client - AI Development Squad Orchestration Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SquadX Team", email = "team@squadx.dev" }
]
dependencies = [
    # LangGraph & LangChain
    # Pinned to the 0.3.x line: langchain 1.x moved ChatLiteLLM out of
    # langchain_community (see llm/router.py), which breaks the client at runtime.
    "langgraph>=0.2.0,<1.0",
    "langchain>=0.3.0,<1.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain-openai>=0.2.0,<1.0",
    "langchain-anthropic>=0.2.0,<1.0",
    "langchain-community>=0.3.0,<1.0",

    # LLM Routing
    "litellm>=1.50.0",

    # Docker
    "docker>=7.1.0",

    # Git
    "gitpython>=3.1.0",

    # WebSocket & HTTP (STOMP/SockJS for Spring Boot)
    "aiohttp>=3.9.0",
    "websockets>=13.0",
    "httpx>=0.28.0",

    # Data & Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",

    # Logging & Storage
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",

    # Utilities
    "watchdog>=6.0.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",

    # Live Streaming (VNC → WebRTC)
    "supabase>=2.0.0",
    "aiortc>=1.9.0",
    "pillow>=10.0.0",
    "av>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
squadx-client = "squadx_client.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require Docker)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
