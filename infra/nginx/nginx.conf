# =============================================================================
# SquadX.dev — Production Nginx Configuration
# =============================================================================
# Backend:  Spring Boot  -> localhost:8080  (/api/v1/**, /ws/**)
# Frontend: Next.js      -> localhost:3000
# TLS terminated here; CORS handled by Spring Boot.
# =============================================================================

# ---------------------------------------------------------------------------
# Worker tuning
# ---------------------------------------------------------------------------
worker_processes auto;                # one worker per CPU core
worker_rlimit_nofile 65535;           # raise fd limit for high-concurrency

events {
    worker_connections 4096;          # max simultaneous connections per worker
    multi_accept on;                  # accept all new connections at once
}

http {
    # -----------------------------------------------------------------------
    # Basic MIME & logging
    # -----------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;                # hide nginx version in responses

    # -----------------------------------------------------------------------
    # Gzip compression
    # Compresses text-based responses to reduce bandwidth. Binary and
    # already-compressed formats are excluded automatically.
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # -----------------------------------------------------------------------
    # Rate limiting — login endpoint
    # Allows a burst of 10 requests and then limits to 5 req/s per client IP.
    # Protects against brute-force credential attacks.
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    # -----------------------------------------------------------------------
    # Upstream definitions
    # Named upstreams make it easy to add more instances later for
    # load balancing.
    # -----------------------------------------------------------------------
    upstream backend {
        server 127.0.0.1:8080;
        keepalive 32;                 # persistent connections to Spring Boot
    }

    upstream frontend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # HTTP -> HTTPS redirect (port 80)
    # All plain-text traffic is permanently redirected to HTTPS.
    # -----------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name squadx.dev www.squadx.dev;

        # Let's Encrypt HTTP-01 challenge path — must remain accessible
        # over plain HTTP so certificate renewal works.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS server (port 443)
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name squadx.dev www.squadx.dev;

        # -------------------------------------------------------------------
        # TLS configuration
        # TLS 1.3 preferred; TLS 1.2 kept as fallback for older clients.
        # Cipher suites are ordered to prefer AEAD ciphers.
        # -------------------------------------------------------------------
        ssl_certificate     /etc/letsencrypt/live/squadx.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/squadx.dev/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;

        # OCSP stapling — speeds up TLS handshake by bundling certificate
        # revocation status into the TLS response.
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/squadx.dev/chain.pem;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # TLS session resumption — reduces latency on repeat connections.
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;      # disable for forward secrecy

        # -------------------------------------------------------------------
        # Security headers
        # -------------------------------------------------------------------
        # HSTS — tell browsers to always use HTTPS for this domain.
        # max-age=63072000 = 2 years; includeSubDomains covers *.squadx.dev.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Prevent the page from being embedded in an iframe (clickjacking).
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Stop browsers from MIME-sniffing the Content-Type.
        add_header X-Content-Type-Options "nosniff" always;

        # Control how much referrer information is sent with requests.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Restrict browser features the page is allowed to use.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # -------------------------------------------------------------------
        # Request size limits
        # -------------------------------------------------------------------
        client_max_body_size 20m;     # allow file uploads up to 20 MB

        # -------------------------------------------------------------------
        # Backend API — /api/v1/**
        # All REST endpoints served by Spring Boot.
        # -------------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://backend;

            # Preserve the original client information so Spring Boot sees
            # real IPs and the correct protocol.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep-alive to upstream.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # -------------------------------------------------------------------
        # Rate-limited login endpoint
        # Sits before the general /api/v1/ block because nginx evaluates
        # the longest matching prefix first.
        # -------------------------------------------------------------------
        location /api/v1/auth/login {
            limit_req zone=login burst=10 nodelay;

            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # -------------------------------------------------------------------
        # WebSocket — /ws/**
        # Used by STOMP/SockJS for real-time messaging. The Upgrade and
        # Connection headers are required for the HTTP -> WebSocket
        # protocol switch. Timeouts are extended because WebSocket
        # connections are long-lived.
        # -------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade headers.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Extended timeouts for persistent WebSocket connections.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # -------------------------------------------------------------------
        # Next.js static assets — /_next/static/**
        # These are content-hashed by Next.js, so they can be cached
        # aggressively (1 year). The immutable directive tells browsers
        # never to revalidate.
        # -------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://frontend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 1-year cache; immutable since filenames contain a hash.
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # -------------------------------------------------------------------
        # Frontend — everything else
        # All non-API, non-WS traffic goes to the Next.js server which
        # handles SSR pages, client routing, and other static assets.
        # -------------------------------------------------------------------
        location / {
            proxy_pass http://frontend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
