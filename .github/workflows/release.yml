name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, Push & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.squadx.dev
            NEXT_PUBLIC_WS_URL=wss://api.squadx.dev/ws
            NEXT_PUBLIC_LIVE_URL=https://live.squadx.dev
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Agent Sandbox Image (base)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/docker/agent.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agent:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Agent Sandbox Image (live-view)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/docker/agent.Dockerfile
          target: live-view
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agent:${{ steps.version.outputs.VERSION }}-live
            ghcr.io/${{ github.repository }}/agent:live
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Egress Proxy Image
        uses: docker/build-push-action@v5
        with:
          context: ./client/docker
          file: ./client/docker/egress-proxy.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/egress-proxy:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/egress-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
